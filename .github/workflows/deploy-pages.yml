name: Deploy to GitHub Pages

# DESATIVADO no push em 06/08/2026 — quem publica o site agora é o
# Cloudflare Pages (projeto ggd-relatorios, conectado a este repo).
# Motivo: em 06/08 o backend do GitHub Pages passou a cancelar TODA deployment
# ("##[error]Deployment cancelled"), com o site parado desde 04:25 UTC. Não era
# o nosso workflow: a fila (cancel-in-progress: false) já estava correta e
# mesmo assim 21 deploys seguidos morreram. Fica só como workflow_dispatch,
# para reativar na mão se um dia precisarmos voltar pro GitHub Pages.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact (site inteiro)
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
