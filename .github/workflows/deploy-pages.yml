name: Deploy to GitHub Pages

# Deploy por FILA (não cancela o deploy em andamento).
# Motivo: este é um monorepo de todos os clientes e as automações empurram
# commits a cada poucos minutos. O deploy padrão do Pages usava
# cancel-in-progress e os deploys se cancelavam entre si, nunca publicando.
# Com cancel-in-progress: false os deploys ENFILEIRAM e cada um conclui.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact (site inteiro)
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
