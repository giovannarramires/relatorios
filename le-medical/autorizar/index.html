<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>LE Medical — Autorização concluída</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--espresso:#403838;--azul:#4A7FC7;--azul-suave:#A4C9FA;--gelo:#EEF4FD;
      --linha:#E3EAF5;--cinza:#7A7070;--pos:#4E9C7A;--aten:#C9A24B}
*{box-sizing:border-box}
body{margin:0;background:var(--gelo);color:var(--espresso);
     font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.55}
.wrap{max-width:620px;margin:0 auto;padding:56px 20px}
.card{background:#fff;border:1px solid var(--linha);border-radius:20px;padding:32px 30px}
h1{font-family:Nunito,sans-serif;font-weight:800;font-size:24px;margin:0 0 6px;letter-spacing:-.4px}
.sub{color:var(--cinza);font-size:15px;margin-bottom:24px}
.ok{display:inline-flex;align-items:center;gap:8px;background:#EAF5F0;color:var(--pos);
    font-weight:600;font-size:13.5px;border-radius:999px;padding:6px 14px;margin-bottom:18px}
.codigo{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:17px;word-break:break-all;
        background:var(--gelo);border:1px solid var(--linha);border-radius:12px;padding:16px 18px;
        text-align:center;font-weight:600}
button{margin-top:14px;width:100%;background:var(--azul);color:#fff;border:0;border-radius:12px;
       padding:14px;font:600 15px Inter,sans-serif;cursor:pointer}
button:hover{background:#3D6DB0}
button.copiado{background:var(--pos)}
.passos{font-size:14.5px;color:var(--cinza);margin-top:24px;padding-top:20px;border-top:1px solid var(--linha)}
.passos b{color:var(--espresso)}
.alerta{background:#FDF6E6;border:1px solid #F0E0B8;border-radius:12px;padding:14px 16px;
        font-size:14px;color:#7A6428;margin-top:16px}
.erro{background:#FBEDED;border:1px solid #F0C9C9;color:#8C3A3A;border-radius:12px;padding:16px 18px;font-size:14.5px}
footer{text-align:center;color:var(--cinza);font-size:12.5px;margin-top:22px}
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="box"></div>
  <footer>GGD — Gio Growth Digital · integração de leitura de vendas da LE Medical</footer>
</div>
<script>
const code = new URLSearchParams(location.search).get('code');
const box = document.getElementById('box');
if (code) {
  box.innerHTML =
    '<div class="ok">✓ Autorização concluída</div>' +
    '<h1>Falta só enviar este código</h1>' +
    '<div class="sub">Copie o código abaixo e mande para a Gio (WhatsApp ou e-mail). ' +
    'Ele libera apenas a <b>leitura das vendas</b> para o painel de acompanhamento — ' +
    'não permite alterar nada na loja.</div>' +
    '<div class="codigo" id="cod"></div>' +
    '<button id="btn">Copiar código</button>' +
    '<div class="alerta">⏱️ Este código vale por <b>5 minutos</b>. Se demorar, é só abrir o link de autorização de novo.</div>';
  document.getElementById('cod').textContent = code;
  const btn = document.getElementById('btn');
  btn.onclick = async () => {
    try { await navigator.clipboard.writeText(code); }
    catch (e) {
      const r = document.createRange(); r.selectNode(document.getElementById('cod'));
      getSelection().removeAllRanges(); getSelection().addRange(r);
    }
    btn.textContent = 'Código copiado ✓'; btn.className = 'copiado';
  };
} else {
  box.innerHTML =
    '<h1>Página de autorização</h1>' +
    '<div class="sub">Esta página mostra o código de autorização depois que o app é aprovado no painel da Nuvemshop.</div>' +
    '<div class="erro">Nenhum código na URL. Abra o link de autorização que a GGD enviou, ' +
    'aceite a permissão de leitura de vendas e você voltará para cá com o código.</div>';
}
</script>
</body>
</html>
