<title>Tracking de Glauber, Carol e Fernanda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Bricolage+Grotesque:opsz,wght@12..96,600&display=swap">
<style>
/* Layout: uma ficha por cliente, na mesma ordem dos campos do formulário de tracking. */
:root {
  --bg: #f3f5f6; --surface: #ffffff; --fg: #1b2428; --muted: #5a6a72; --line: #d8dfe3;
  --accent: #0b6e75; --accent-soft: #e0f0f0; --on-accent: #ffffff; --warn: #8a5300; --warn-soft: #fbf0dc;
  --display: "Bricolage Grotesque", "IBM Plex Sans", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12181b; --surface: #1a2226; --fg: #e7edef; --muted: #9dacb3; --line: #2e3a40;
  --accent: #5cc4c9; --accent-soft: #17343a; --on-accent: #0c1a1c; --warn: #eab565; --warn-soft: #362a14; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #12181b; --surface: #1a2226; --fg: #e7edef; --muted: #9dacb3; --line: #2e3a40;
  --accent: #5cc4c9; --accent-soft: #17343a; --on-accent: #0c1a1c; --warn: #eab565; --warn-soft: #362a14; color-scheme: dark;
}
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.55; }
.wrap { max-width: 860px; margin: 0 auto; padding-inline: 20px; padding-block: 36px 56px; display: grid; gap: 32px; }
h1, h2 { font-family: var(--display); font-weight: 600; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(1.7rem, 5vw, 2.3rem); line-height: 1.15; }
h2 { font-size: 1.25rem; }
p { margin: 0; max-width: 68ch; }
.lead { color: var(--muted); margin-top: 8px; }
.clients { display: grid; gap: 16px; }
.client { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px; display: grid; gap: 14px; }
.client header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 16px; }
.acct { color: var(--muted); font-size: 13px; }
.field { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 4px 14px; align-items: center; border-top: 1px solid var(--line); padding-top: 12px; }
.label { font-weight: 500; font-size: 14px; }
.value { min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
code { font-family: var(--mono); font-size: 15px; font-weight: 500; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.small { font-size: 13px; color: var(--muted); }
button { font: 500 13px var(--body); color: var(--accent); background: var(--accent-soft); border: 0; border-radius: 6px; padding: 5px 10px; cursor: pointer; }
a.go { font: 500 13px var(--body); color: var(--on-accent); background: var(--accent); border-radius: 6px; padding: 5px 10px; text-decoration: none; }
button:focus-visible, a.go:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.pill { font-size: 12px; font-weight: 500; border-radius: 99px; padding: 2px 9px; background: var(--warn-soft); color: var(--warn); }
.note { background: var(--warn-soft); border-radius: 6px; padding: 10px 12px; font-size: 14px; max-width: none; }
.section { display: grid; gap: 12px; }
ol, ul { margin: 0; padding-left: 22px; display: grid; gap: 8px; max-width: 68ch; }
@media (max-width: 560px) { .field { grid-template-columns: minmax(0, 1fr); } }

body { margin: 0; }
.lock { max-width: 380px; margin: 0 auto; padding-inline: 20px; padding-block: 18vh 40px; display: grid; gap: 14px; }
.lock h1 { font-size: 1.6rem; }
.lock label { font-weight: 500; font-size: 14px; }
.lock input { font: 400 16px var(--mono); color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; width: 100%; box-sizing: border-box; }
.lock input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.lock button { font-size: 15px; padding: 10px 12px; color: var(--on-accent); background: var(--accent); }
.lock .err { color: var(--warn); font-size: 14px; min-height: 1.4em; margin: 0; }
.lock form { display: grid; gap: 10px; }
</style>
</head>

    <button type="submit" id="abrir">Abrir</button>
    <p class="err" id="err" role="alert"></p>
  </form>
</main>

<script>
var D = JSON.parse(document.getElementById('dados').textContent);
function bin(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
async function abrir(senha) {
  var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(senha), 'PBKDF2', false, ['deriveKey']);
  var chave = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: bin(D.s), iterations: D.n, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  var claro = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bin(D.i) }, chave, bin(D.c));
  return new TextDecoder().decode(claro);
}
function copiar() {
  document.querySelectorAll('[data-copy]').forEach(function (b) {
    b.addEventListener('click', function () {
      var done = function (t) { b.textContent = t; setTimeout(function () { b.textContent = 'Copiar'; }, 1500); };
      var sel = function () {
        var r = document.createRange(); r.selectNodeContents(b.previousElementSibling);
        var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); done('Selecionado');
      };
      if (navigator.clipboard) { navigator.clipboard.writeText(b.dataset.copy).then(function () { done('Copiado'); }, sel); }
      else { sel(); }
    });
  });
}
document.getElementById('f').addEventListener('submit', async function (e) {
  e.preventDefault();
  var err = document.getElementById('err'), bt = document.getElementById('abrir');
  err.textContent = ''; bt.disabled = true; bt.textContent = 'Abrindo…';
  try {
    var html = await abrir(document.getElementById('senha').value);
    var c = document.getElementById('conteudo');
    c.innerHTML = html; c.hidden = false;
    document.getElementById('lock').hidden = true;
    copiar();
  } catch (x) {
    err.textContent = 'Senha incorreta. Confira e tente de novo.';
    bt.disabled = false; bt.textContent = 'Abrir';
  }
});
</script>
</body>
</html>
