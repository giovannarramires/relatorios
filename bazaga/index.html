  --muted:#6b6e6a;
  --accent:#2a7fb5;

  --ui:"Archivo",system-ui,-apple-system,sans-serif;
  --gut:clamp(20px,5vw,64px);

@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#ecece7;
    --ground:#111312;
    --surface:#191c1b;
    --line:#2f3332;

:root[data-theme="dark"]{
  --ink:#ecece7;
  --ground:#111312;
  --surface:#191c1b;
  --line:#2f3332;
  --line-soft:#232726;
  --muted:#9ba09c;

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--ground);
  color:var(--ink);
  font-family:var(--ui);
  font-size:17px;
  line-height:1.65;
  font-weight:400;

}
img{max-width:100%}
a{color:inherit}
:where(a,button):focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* ================= topo ================= */
.topbar{
  position:sticky;top:0;z-index:20;
  background:color-mix(in srgb,var(--ground) 92%,transparent);
  backdrop-filter:saturate(1.6) blur(10px);
  border-bottom:1px solid var(--line-soft);
}
.topbar-in{
  max-width:1280px;margin:0 auto;
  padding-inline:var(--gut);padding-block:14px;
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;
}
.brand{
  font-family:var(--display);font-size:19px;letter-spacing:.06em;
  text-transform:uppercase;text-decoration:none;margin-right:auto;
}
nav{display:flex;gap:22px}
nav a{
  font-size:13.5px;letter-spacing:.06em;text-decoration:none;color:var(--muted);
  padding-block:4px;border-bottom:1px solid transparent;transition:color .18s,border-color .18s;
}
nav a:hover{color:var(--ink);border-bottom-color:var(--ink)}
.langs{display:flex;gap:2px;border:1px solid var(--line);border-radius:999px;padding:2px}
.langs button{
  font-family:var(--ui);font-size:11.5px;font-weight:600;letter-spacing:.09em;
  background:none;border:0;color:var(--muted);cursor:pointer;
  padding:5px 10px;border-radius:999px;transition:background .18s,color .18s;
}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--ground)}

/* ================= estrutura ================= */
main{max-width:1280px;margin:0 auto;padding-inline:var(--gut)}
section{padding-block:clamp(56px,9vw,116px);border-bottom:1px solid var(--line-soft)}
section:last-of-type{border-bottom:0}
.kicker{
  font-size:11.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;
  color:var(--muted);display:block;margin-bottom:22px;
}
h1,h2,h3{margin:0;font-weight:400;text-wrap:balance}

/* ================= hero ================= */
.hero{padding-block:clamp(44px,8vw,90px) clamp(40px,6vw,72px);border-bottom:0}
.hero h1{
  font-family:var(--display);
  font-size:clamp(52px,13vw,148px);
  line-height:.92;letter-spacing:-.015em;
  margin-bottom:18px;
}
.hero .role{
  font-size:12px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;
  color:var(--muted);display:block;margin-bottom:34px;
}
.hero .lead{
  font-family:var(--display);
  font-size:clamp(21px,2.9vw,33px);
  line-height:1.32;max-width:26ch;margin-bottom:34px;
}
.hero .scroll{
  display:inline-flex;align-items:center;gap:9px;text-decoration:none;
  font-size:13px;letter-spacing:.08em;text-transform:uppercase;font-weight:500;
  border-bottom:1px solid var(--ink);padding-bottom:5px;
}
.hero-art{margin-top:clamp(40px,7vw,80px)}
.hero-art img{width:100%;height:auto;display:block}
.hero-art figcaption{
  margin-top:12px;font-size:13px;color:var(--muted);
  display:flex;flex-wrap:wrap;gap:4px 12px;
}
.hero-art figcaption b{font-weight:500;color:var(--ink);font-style:italic}

/* ================= sobre ================= */
.about{display:grid;gap:clamp(28px,5vw,64px);grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.about{grid-template-columns:minmax(0,34%) minmax(0,66%)}}
.about h2{font-family:var(--display);font-size:clamp(30px,4.6vw,52px);line-height:1.05;letter-spacing:-.01em}
.about-portrait{margin:30px 0 0;max-width:360px}
.about-portrait img{width:100%;height:auto;display:block;background:var(--line-soft)}
.about-portrait figcaption{margin-top:11px;font-size:13px;color:var(--muted);line-height:1.5}
.about-body{display:flex;flex-direction:column;gap:20px;max-width:62ch}
.about-body p{margin:0}
.about-body .bio{
  font-family:var(--display);font-size:clamp(19px,2.2vw,24px);line-height:1.45;
  padding-bottom:6px;
}
.cv{
  margin-top:14px;padding-top:20px;border-top:1px solid var(--line);
  display:flex;flex-direction:column;gap:8px;
}
.cv .cv-label{font-size:11.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.cv p{font-size:15.5px;color:var(--muted);margin:0}

/* ================= obras ================= */
.works-head{display:flex;flex-wrap:wrap;gap:16px 40px;align-items:flex-end;justify-content:space-between;margin-bottom:clamp(30px,4vw,54px)}
.works-head h2{font-family:var(--display);font-size:clamp(30px,4.6vw,52px);line-height:1.05;letter-spacing:-.01em}
.works-head .note{font-size:15px;color:var(--muted);max-width:44ch}

.row{display:grid;gap:clamp(20px,3.2vw,44px);align-items:start;margin-bottom:clamp(28px,4.5vw,64px)}
.row.two{grid-template-columns:minmax(0,1fr)}
@media (min-width:760px){.row.two{grid-template-columns:repeat(2,minmax(0,1fr))}}
.row.half{grid-template-columns:minmax(0,1fr)}
@media (min-width:760px){.row.half{grid-template-columns:minmax(0,52%) minmax(0,1fr)}}
.row.feature{grid-template-columns:minmax(0,1fr);margin-bottom:0}
@media (min-width:760px){.row.feature{grid-template-columns:minmax(0,72%) minmax(0,1fr);align-items:end}}
.row.feature figure.work .t{font-size:clamp(22px,2.8vw,30px)}

figure.work{margin:0;display:flex;flex-direction:column;gap:13px}
figure.work img{
  width:100%;height:auto;display:block;
  background:var(--line-soft);
  transition:opacity .25s;
}
figure.work:hover img{opacity:.92}
figure.work figcaption{display:flex;flex-direction:column;gap:2px}
figure.work .t{font-family:var(--display);font-size:clamp(18px,2vw,22px);font-style:italic}
figure.work .m{font-size:14px;color:var(--muted)}
figure.work .d{font-size:14.5px;line-height:1.55;color:var(--muted);margin:9px 0 0;max-width:54ch}
.ar-9273 img{aspect-ratio:92/73;object-fit:contain}
.ar-8060 img{aspect-ratio:60/80;object-fit:contain}
.ar-6080 img{aspect-ratio:80/60;object-fit:contain}
.ar-sq img{aspect-ratio:1/1;object-fit:contain}

.pf-ask{
  margin-top:clamp(20px,3vw,38px);
  padding-top:26px;border-top:1px solid var(--line);
  display:flex;flex-wrap:wrap;gap:14px 28px;align-items:baseline;
}
.pf-ask a{
  display:inline-flex;align-items:center;gap:9px;
  font-size:13.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:500;
  text-decoration:none;border-bottom:1px solid var(--ink);padding-bottom:5px;
}
.pf-ask span{font-size:14.5px;color:var(--muted)}

/* ================= contato ================= */
.contact{display:grid;gap:clamp(24px,4vw,56px);grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.contact{grid-template-columns:minmax(0,34%) minmax(0,66%)}}
.contact h2{font-family:var(--display);font-size:clamp(30px,4.6vw,52px);line-height:1.05;letter-spacing:-.01em}
.contact .note{font-size:16px;color:var(--muted);max-width:40ch;margin-bottom:28px}
.cbox{display:flex;flex-direction:column}
.cline{
  display:flex;flex-wrap:wrap;gap:4px 18px;align-items:baseline;
  padding-block:16px;border-top:1px solid var(--line);
}
.cline:last-child{border-bottom:1px solid var(--line)}
.cline .k{font-size:11.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);min-width:84px}
.cline .v{font-family:var(--display);font-size:clamp(19px,2.3vw,26px)}
.cline a{text-decoration:none;border-bottom:1px solid var(--line);transition:border-color .18s}
.cline a:hover{border-bottom-color:var(--ink)}

footer{
  max-width:1280px;margin:0 auto;padding-inline:var(--gut);
  padding-block:30px 44px;border-top:1px solid var(--line-soft);
  display:flex;flex-wrap:wrap;gap:8px 26px;justify-content:space-between;
  font-size:12.5px;color:var(--muted);
}
</style>

  var LANGS = ["es","en","pt","fr"];
  var HTMLLANG = {es:"es",en:"en",pt:"pt-BR",fr:"fr"};

  function apply(lang){
    if(LANGS.indexOf(lang) === -1){ lang = "es"; }
    var dict = T[lang];
    document.documentElement.setAttribute("lang", HTMLLANG[lang]);
    document.querySelectorAll("[data-t]").forEach(function(el){
      var v = dict[el.dataset.t];
      if(typeof v === "string"){ el.textContent = v; }
    });
    document.querySelectorAll(".langs button").forEach(function(b){
      b.setAttribute("aria-pressed", String(b.dataset.set === lang));
    });
    try{ localStorage.setItem("bazaga-lang", lang); }catch(e){}
  }

  document.querySelectorAll(".langs button").forEach(function(b){
    b.addEventListener("click", function(){ apply(b.dataset.set); });
  });

  /* o espanhol e a entrada: so muda se a pessoa ja escolheu outro idioma aqui */
  var start = null;
  try{ start = localStorage.getItem("bazaga-lang"); }catch(e){}
  apply(LANGS.indexOf(start) !== -1 ? start : "es");
})();
</script>
